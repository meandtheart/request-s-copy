<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Yaeneko</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <style>
        .checkout-container {
            max-width: 960px;
            margin: 40px auto 0 auto;
            padding: 20px 16px 80px 16px;
        }

        .checkout-title {
            font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
            font-size: 2rem;
            color: #5c4d4c;
            text-align: center;
            margin: 20px 0 30px 0;
        }

        .checkout-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (min-width: 850px) {
            .checkout-layout {
                display: grid;
                grid-template-columns: 1fr 380px;
                align-items: start;
            }
        }

        .checkout-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 24px rgba(115, 94, 89, 0.08);
            margin-bottom: 20px;
        }

        .section-heading {
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.25rem;
            color: #5c4d4c;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(115, 94, 89, 0.12);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 550px) {
            .form-grid.two-col {
                grid-template-columns: 1fr 1fr;
            }
            .form-grid.three-col {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            color: #5c4d4c;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1.5px solid #e2d7c8;
            background-color: #fffaf5;
            font-family: inherit;
            font-size: 0.95rem;
            color: #5c4d4c;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ab9685;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(171, 150, 133, 0.2);
        }

        .form-group select:disabled {
            background-color: #f1ebd8;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .advance-notice {
            background: #fff4e5;
            border: 1.5px solid #f3d1a8;
            border-radius: 18px;
            padding: 14px 16px;
            margin-bottom: 18px;
            font-size: 0.88rem;
            color: #735e59;
            line-height: 1.45;
        }

        .advance-notice strong {
            color: #d97706;
            font-family: 'Fredoka', sans-serif;
        }

        .order-summary-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 24px rgba(115, 94, 89, 0.1);
            position: sticky;
            top: 20px;
        }

        .cart-mini-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(115, 94, 89, 0.15);
        }

        .cart-mini-img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
            background: #f7efe3;
        }

        .cart-mini-info {
            flex: 1;
        }

        .cart-mini-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            color: #5c4d4c;
        }

        .cart-mini-meta {
            font-size: 0.8rem;
            color: #8c706b;
        }

        .price-breakdown {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #5c4d4c;
        }

        .summary-row.highlight {
            background-color: #f7efe3;
            padding: 12px;
            border-radius: 16px;
            font-weight: 700;
            color: #5c4d4c;
            border: 1px solid #ebdccb;
        }

        .summary-row.highlight .amount {
            color: #d97706;
            font-size: 1.1rem;
        }

        .summary-row.due {
            padding: 4px 12px;
            font-size: 0.88rem;
            color: #8c706b;
        }

        .place-order-btn {
            width: 100%;
            padding: 16px;
            margin-top: 18px;
            border: none;
            border-radius: 20px;
            background-color: #5c4d4c;
            color: #ffffff;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(92, 77, 76, 0.2);
            transition: all 0.2s ease;
        }

        .place-order-btn:hover {
            background-color: #443736;
            transform: translateY(-2px);
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .payment-option {
            flex: 1;
            padding: 12px 8px;
            border-radius: 16px;
            border: 1.5px solid #e2d7c8;
            background: #fffaf5;
            text-align: center;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .payment-option.active {
            border-color: #5c4d4c;
            background: #5c4d4c;
            color: #fff;
            font-weight: 600;
        }

        .empty-checkout {
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            border-radius: 28px;
        }

        /* Top Left Home Link Styling */
        .corner-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            color: #5c4d4c;
            text-decoration: none;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(115, 94, 89, 0.08);
            transition: all 0.25 ease;
        }

        .corner-nav-btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(115, 94, 89, 0.15);
            color: #443736;
        }

        .corner-nav-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Fixed Bottom Left Shop Button */
        .bottom-left-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="page-bg"></div>

    <header class="shop-header">
        <h1 class="logo">Yaeneko</h1>
    </header>

    <main class="checkout-container">
        <a href="index.html" class="corner-nav-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
        </a>

        <h2 class="checkout-title">Complete Your Order</h2>

        <div id="checkoutView"></div>
    </main>

    <a href="shop.html" class="corner-nav-btn bottom-left-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Shop</span>
    </a>

    <footer class="site-footer">
        <div class="footer-content">
            <h2 class="footer-logo">Yaeneko</h2>

            <p class="footer-bio">
                Handcrafted plushies & cozy creations made with warm pastel love.
            </p>

            <nav class="footer-links-row" aria-label="Footer Navigation">
                <a href="about.html" class="footer-link">About Me</a>
                <span class="footer-dot">•</span>
                <a href="policies.html#order-policy" class="footer-link">Order Policy</a>
                <span class="footer-dot">•</span>
                <a href="policies.html#order-policy" class="footer-link">Shipping Policy</a>
            </nav>

            <div class="footer-socials-row">
                <a href="https://www.instagram.com/yaeneko.bd?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="social-btn" 
                   aria-label="Instagram">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>

                <a href="https://www.facebook.com/people/Yaenekobd/61579429420812/" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="social-btn" 
                   aria-label="Facebook">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                    </svg>

                <a href="https://www.tiktok.com/@yaeneko.bd" 
                   target="_blank" 
                   rel="noopener noreferrer"

                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
                    </svg>

            </div>

            <p class="footer-copyright">© 2026 Yaeneko. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Bangladesh Locations Data
        const bdLocations = {
            "Dhaka": {
                "Dhaka": ["Dhanmondi", "Gulshan", "Banani", "Uttara", "Mirpur", "Mohammadpur", "Badda", "Khilgaon", "Old Dhaka", "Savar", "Keraniganj"],
                "Gazipur": ["Gazipur Sadar", "Kaliakair", "Kapasia", "Sreepur", "Kaliganj"],
                "Narayanganj": ["Narayanganj Sadar", "Araihazar", "Bandar", "Rupganj", "Sonargaon"],
                "Tangail": ["Tangail Sadar", "Mirzapur", "Delduar", "Nagarpur", "Ghatail", "Kalihati"],
                "Faridpur": ["Faridpur Sadar", "Bhanga", "Boalmari", "Charbhadrasan", "Sadarpur"]
            },
            "Chattogram": {
                "Chattogram": ["Agrabad", "GEC Circle", "Halishahar", "Panchlaish", "Nasirabad", "Kotwali", "Khulshi", "Patenga", "Hathazari"],
                "Cox's Bazar": ["Cox's Bazar Sadar", "Chakaria", "Teknaf", "Ukhia", "Ramu", "Maheshkhali"],
                "Cumilla": ["Cumilla Sadar", "Daudkandi", "Chandina", "Laksam", "Burichang"],
                "Feni": ["Feni Sadar", "Chhagalnaiya", "Daganbhuiyan", "Parshuram"],
                "Noakhali": ["Noakhali Sadar", "Begumganj", "Chhatkhil", "Senbagh"]
            },
            "Rajshahi": {
                "Rajshahi": ["Boalia", "Rajpara", "Motihar", "Shah Makhdum", "Paba", "Godagari"],
                "Bogra": ["Bogra Sadar", "Shajahanpur", "Sherpur", "Ghabtali", "Dhunat"],
                "Pabna": ["Pabna Sadar", "Ishwardi", "Santhia", "Bera", "Chatmohar"]
            },
            "Khulna": {
                "Khulna": ["Khulna Sadar", "Sonadanga", "Khalishpur", "Daulatpur", "Dumuria", "Phultala"],
                "Jessore": ["Jessore Sadar", "Jhikargachha", "Abhaynagar", "Bagherpara"],
                "Kushtia": ["Kushtia Sadar", "Kumarkhali", "Mirpur", "Bheramara"]
            },
            "Barishal": {
                "Barishal": ["Barishal Sadar", "Babuganj", "Bakerganj", "Banaripara", "Gournadi"],
                "Patuakhali": ["Patuakhali Sadar", "Galachipa", "Kalapara", "Bauphal"]
            },
            "Sylhet": {
                "Sylhet": ["Zindabazar", "Amberkhana", "Upashahar", "Sylhet Sadar", "Beanibazar", "Golapganj"],
                "Moulvibazar": ["Moulvibazar Sadar", "Sreemangal", "Kulaura", "Kamalganj"]
            },
            "Rangpur": {
                "Rangpur": ["Rangpur Sadar", "Badarganj", "Mithapukur", "Pirganj"],
                "Dinajpur": ["Dinajpur Sadar", "Birganj", "Birampur", "Phulbari"]
            },
            "Mymensingh": {
                "Mymensingh": ["Mymensingh Sadar", "Muktagachha", "Bhaluka", "Trishal", "Gafargaon"],
                "Jamalpur": ["Jamalpur Sadar", "Sarishabari", "Melandahn", "Islampur"]
            }
        };

        let selectedPaymentMethod = 'bKash';

        // Safe price parser (handles string inputs like "500 Tk" or 500)
        function parsePrice(price) {
            if (typeof price === 'number') return price;
            if (!price) return 0;
            const cleaned = String(price).replace(/[^0-9.]/g, '');
            return parseFloat(cleaned) || 0;
        }

        // Price formatting function
        function safeFormatBDT(amount) {
            if (typeof formatBDT === 'function') {
                return formatBDT(amount);
            }
            return `৳${Math.round(amount).toLocaleString('en-BD')}`;
        }

        function renderCheckout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('checkoutView');

            if (!cart.length) {
                container.innerHTML = `
                    <div class="empty-checkout">
                        <p style="font-family:'Fredoka',sans-serif; font-size:1.2rem; color:#735e59;">Your shopping bag is empty.</p>
                        <a href="shop.html" style="display:inline-block; margin-top:16px; color:#5c4d4c; font-family:'Fredoka',sans-serif;">Explore Shop</a>
                    </div>
                `;
                return;
            }

            // Accurate subtotal calculation
            const subtotal = cart.reduce((sum, item) => {
                const itemPrice = parsePrice(item.price);
                const itemQty = parseInt(item.quantity) || 1;
                return sum + (itemPrice * itemQty);
            }, 0);

            const advanceAmount = subtotal * 0.80; // 80% Advance
            const remainingAmount = subtotal * 0.20; // 20% Remaining

            const itemsHTML = cart.map(item => {
                const priceNum = parsePrice(item.price);
                const qtyNum = parseInt(item.quantity) || 1;
                const itemTotal = priceNum * qtyNum;
                const imgSrc = (item.images && item.images[0]) ? item.images[0] : (item.image || 'https://via.placeholder.com/80');

                return `
                    <div class="cart-mini-item">
                        <img src="${imgSrc}" class="cart-mini-img" alt="${item.title || 'Product'}">
                        <div class="cart-mini-info">
                            <div class="cart-mini-title">${item.title || 'Product'}</div>
                            <div class="cart-mini-meta">Qty: ${qtyNum} × ${safeFormatBDT(priceNum)}</div>
                        </div>
                        <div style="font-weight:600; font-size:0.9rem;">${safeFormatBDT(itemTotal)}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="checkout-layout">
                    <form id="orderForm" onsubmit="handleOrderSubmit(event)">
                        <div class="checkout-card">
                            <div class="section-heading">
                                <span>1. Customer Details</span>
                            </div>
                            <div class="form-grid two-col">
                                <div class="form-group">
                                    <label>Full Name *</label>
                                    <input type="text" id="custName" required placeholder="e.g. Ayesha Rahman">
                                </div>
                                <div class="form-group">
                                    <label>Phone Number *</label>
                                    <input type="tel" id="custPhone" required placeholder="017XXXXXXXX">
                                </div>
                            </div>
                        </div>

                        <div class="checkout-card">
                            <div class="section-heading">
                                <span>2. Delivery Location (Bangladesh)</span>
                            </div>
                            <div class="form-grid three-col">
                                <div class="form-group">
                                    <label>Division *</label>
                                    <select id="divisionSelect" required onchange="handleDivisionChange()">
                                        <option value="">Select Division</option>
                                        ${Object.keys(bdLocations).map(div => `<option value="${div}">${div}</option>`).join('')}
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>District *</label>
                                    <select id="districtSelect" required disabled onchange="handleDistrictChange()">
                                        <option value="">Select District</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>Area / Upazila / Thana *</label>
                                    <select id="areaSelect" required disabled>
                                        <option value="">Select Area</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group" style="margin-top:16px;">
                                <label>House / Road / Street Address *</label>
                                <textarea id="custAddress" rows="2" required placeholder="House No, Road No, Area details, Flat/Floor"></textarea>
                            </div>

                            <div class="form-group" style="margin-top:12px;">
                                <label>Delivery Notes (Optional)</label>
                                <input type="text" id="custNotes" placeholder="Special instructions for delivery rider">
                            </div>
                        </div>

                        <div class="checkout-card">
                            <div class="section-heading">
                                <span>3. Payment (80% Advance Required)</span>
                            </div>

                            <div class="advance-notice">
                                📌 <strong>Policy Note:</strong> We require an <strong>80% advance payment (${safeFormatBDT(advanceAmount)})</strong> to confirm custom orders. The remaining 20% (${safeFormatBDT(remainingAmount)}) is paid cash on delivery.
                            </div>

                            <div class="form-group">
                                <label>Select Payment Method</label>
                                <div class="payment-methods">
                                    <div class="payment-option active" onclick="selectPayment('bKash', this)">bKash</div>
                                    <div class="payment-option" onclick="selectPayment('Nagad', this)">Nagad</div>
                                    <div class="payment-option" onclick="selectPayment('Rocket', this)">Rocket</div>
                                </div>
                            </div>

                            <div style="background:#fffaf5; border:1px solid #e2d7c8; border-radius:16px; padding:14px; margin-top:14px;">
                                <p style="font-size:0.88rem; color:#5c4d4c;">Send <strong>${safeFormatBDT(advanceAmount)}</strong> to our official <span id="paymentName">bKash</span> Personal Number: <strong>01700000000</strong></p>
                            </div>

                            <div class="form-grid two-col" style="margin-top:14px;">
                                <div class="form-group">
                                    <label>Sender Mobile Number *</label>
                                    <input type="tel" id="senderPhone" required placeholder="017XXXXXXXX">
                                </div>
                                <div class="form-group">
                                    <label>Transaction ID (TrxID) *</label>
                                    <input type="text" id="trxId" required placeholder="e.g. 9J87A6K5">
                                </div>
                            </div>
                        </div>
                    </form>

                    <div class="order-summary-card">
                        <h3 style="font-family:'Fredoka',sans-serif; margin-bottom:12px; color:#5c4d4c;">Order Summary</h3>
                        
                        <div style="max-height: 220px; overflow-y: auto;">
                            ${itemsHTML}
                        </div>

                        <div class="price-breakdown">
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span>${safeFormatBDT(subtotal)}</span>
                            </div>
                            
                            <div class="summary-row highlight">
                                <span>80% Advance (Pay Now)</span>
                                <span class="amount">${safeFormatBDT(advanceAmount)}</span>
                            </div>

                            <div class="summary-row due">
                                <span>20% Due on Delivery</span>
                                <span>${safeFormatBDT(remainingAmount)}</span>
                            </div>
                        </div>

                        <button type="submit" form="orderForm" class="place-order-btn">
                            Confirm Order & Pay ${safeFormatBDT(advanceAmount)}
                        </button>
                    </div>
                </div>
            `;
        }

        function handleDivisionChange() {
            const divSelect = document.getElementById('divisionSelect');
            const distSelect = document.getElementById('districtSelect');
            const areaSelect = document.getElementById('areaSelect');

            const selectedDiv = divSelect.value;
            distSelect.innerHTML = '<option value="">Select District</option>';
            areaSelect.innerHTML = '<option value="">Select Area</option>';
            areaSelect.disabled = true;

            if (selectedDiv && bdLocations[selectedDiv]) {
                distSelect.disabled = false;
                Object.keys(bdLocations[selectedDiv]).forEach(dist => {
                    distSelect.innerHTML += `<option value="${dist}">${dist}</option>`;
                });
            } else {
                distSelect.disabled = true;
            }
        }

        function handleDistrictChange() {
            const divSelect = document.getElementById('divisionSelect');
            const distSelect = document.getElementById('districtSelect');
            const areaSelect = document.getElementById('areaSelect');

            const selectedDiv = divSelect.value;
            const selectedDist = distSelect.value;

            areaSelect.innerHTML = '<option value="">Select Area</option>';

            if (selectedDiv && selectedDist && bdLocations[selectedDiv][selectedDist]) {
                areaSelect.disabled = false;
                bdLocations[selectedDiv][selectedDist].forEach(area => {
                    areaSelect.innerHTML += `<option value="${area}">${area}</option>`;
                });
            } else {
                areaSelect.disabled = true;
            }
        }

        function selectPayment(method, element) {
            selectedPaymentMethod = method;
            document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('paymentName').textContent = method;
        }

        function handleOrderSubmit(e) {
            e.preventDefault();

            const orderDetails = {
                name: document.getElementById('custName').value,
                phone: document.getElementById('custPhone').value,
                division: document.getElementById('divisionSelect').value,
                district: document.getElementById('districtSelect').value,
                area: document.getElementById('areaSelect').value,
                address: document.getElementById('custAddress').value,
                notes: document.getElementById('custNotes').value,
                paymentMethod: selectedPaymentMethod,
                senderPhone: document.getElementById('senderPhone').value,
                trxId: document.getElementById('trxId').value
            };

            alert(`Thank you, ${orderDetails.name}! Your order has been placed.\n\nWe received your 80% advance payment reference (TrxID: ${orderDetails.trxId}). We will contact you at ${orderDetails.phone} shortly.`);

            localStorage.removeItem('cart');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', renderCheckout);
    </script>
</body>
</html>
