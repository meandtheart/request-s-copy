    <style>
        .cart-container {
            max-width: 800px;
            margin: 80px auto 0 auto;
            padding: 20px 16px 140px 16px;
        }

        .cart-title {
            font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
            font-size: 2rem;
            color: #5c4d4c;
            text-align: center;
            margin: 20px 0 30px 0;
        }

        .cart-layout {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .cart-layout {
                display: grid;
                grid-template-columns: 1fr 320px;
                align-items: start;
            }
        }

        /* Cart Items Card List */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #ffffff;
            padding: 16px;
            border-radius: 24px;
            box-shadow: 0 6px 18px rgba(115, 94, 89, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: transform 0.2s ease;
        }

        .cart-item-img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
            background-color: #f7efe3;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cart-item-title {
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.1rem;
            color: #5c4d4c;
            margin: 0;
        }

        .cart-item-price {
            font-weight: 700;
            color: #8c706b;
            font-size: 0.95rem;
        }

        /* Quantity Selector */
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #f7efe3;
            color: #5c4d4c;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .qty-btn:active {
            transform: scale(0.9);
        }

        .qty-value {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            min-width: 20px;
            text-align: center;
        }

.remove-btn {
  /* Layout & Sizing */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%; /* Makes it perfectly pill/circle soft */
  border: none;
  
  /* Soft Palette (Pastel Pink) */
  background-color: #ffe5ec;
  color: #ff85a1;
  
  /* Micro-interactions */
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy, playful feel */
  outline: none;
}

.remove-btn:hover {
  background-color: #ffb3c1;
  color: #ffffff;
  transform: scale(1.1) rotate(6deg); /* Subtle playful wiggle */
  box-shadow: 0 4px 12px rgba(255, 133, 161, 0.3);
}

.remove-btn:active {
  transform: scale(0.92);
}

        /* Cart Summary Glass Card */
        .cart-summary {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 24px rgba(115, 94, 89, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .summary-title {
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.3rem;
            color: #5c4d4c;
            margin: 0;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(115, 94, 89, 0.15);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #5c4d4c;
        }

        .summary-row.total {
            font-weight: 700;
            font-size: 1.15rem;
            padding-top: 12px;
            border-top: 1px solid rgba(115, 94, 89, 0.15);
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 20px;
            background-color: #5c4d4c;
            color: #ffffff;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(92, 77, 76, 0.2);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .checkout-btn:hover {
            background-color: #443736;
            transform: translateY(-2px);
        }

        /* Empty Cart State */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 6px 18px rgba(115, 94, 89, 0.08);
        }

        .empty-cart p {
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.2rem;
            color: #735e59;
            margin-bottom: 20px;
        }

        .shop-now-btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #ab9685;
            color: #fcf9f2;
            border-radius: 30px;
            text-decoration: none;
            font-family: 'Fredoka', cursive, sans-serif;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(92, 77, 76, 0.15);
            transition: transform 0.2s ease;
        }

        .shop-now-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

    <script src="script.js"></script>
    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('cart')) || [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            if (typeof updateCartBadge === 'function') {
                updateCartBadge();
            }
            renderCart();
        }

        function changeQuantity(index, delta) {
            let cart = getCart();
            if (cart[index]) {
                cart[index].quantity = (cart[index].quantity || 1) + delta;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
            }
            saveCart(cart);
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
        }

        function parsePrice(priceStr) {
            if (!priceStr) return 0;
            return parseFloat(priceStr.replace(/[^0-9.-]+/g, "")) || 0;
        }

        function renderCart() {
            const container = document.getElementById('cartView');
            const cart = getCart();

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <p>Your cart is currently empty ✨</p>
                        <a href="shop.html" class="shop-now-btn">Explore Creations</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            let itemsHTML = cart.map((item, index) => {
                const itemQty = item.quantity || 1;
                const priceNum = parsePrice(item.price);
                const itemTotal = priceNum * itemQty;
                subtotal += itemTotal;

                const imageSrc = Array.isArray(item.images) ? item.images[0] : (item.image || 'logo1.jpg');

                return `
                    <div class="cart-item">
                        <img src="${imageSrc}" alt="${item.title}" class="cart-item-img">
                        <div class="cart-item-info">
                            <h3 class="cart-item-title">${item.title}</h3>
                            <span class="cart-item-price">${item.price || formatBDT(0)}</span>
                            <div class="quantity-controls">
                                <button class="qty-btn" onclick="changeQuantity(${index}, -1)">-</button>
                                <span class="qty-value">${itemQty}</span>
                                <button class="qty-btn" onclick="changeQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                    <button class="remove-btn" onclick="removeItem(${index})" aria-label="Remove item">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</button>
                    </div>
                `;
            }).join('');

            // Flat shipping fee in Taka — adjust this to whatever you actually charge.
            

            container.innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">
                        ${itemsHTML}
                    </div>

                <div class="cart-summary">
                        <h3 class="summary-title">Order Summary</h3>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>${formatBDT(subtotal)}</span>
                        </div>
                        <button class="checkout-btn" onclick="window.location.href='checkout.html'">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            `;
        }
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
